<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VIPulse 2.0</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>
</head>
<body class="bg-dark text-white min-vh-100">
    <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center">
        <div class="card bg-secondary bg-opacity-25 border-secondary shadow-lg text-white p-4 rounded-4 w-100" style="max-width: 440px;">
    <h1>VIPulse 2.0</h1>
    <h2>Staff Login</h2>

    {% if form.errors %}
        <p>Invalid username or password. Please try again.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

       <div class="mb-3">
    <label for="id_username" class="form-label">
        Username
    </label>

    <div class="w-100">
        {{ form.username }}
    </div>
</div>

       <div class="mb-4">
    <label for="id_password" class="form-label">
        Password
    </label>

    <div class="w-100">
        {{ form.password }}
    </div>
</div>

        <button type="submit">Log In</button>
    </form>
     </div>
</div>
</body>
</html>
