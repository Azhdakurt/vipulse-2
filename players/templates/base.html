<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}VIPulse 2.0{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block extra_css %}
{% endblock %}
<link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
            💎 VIPulse
        </a>

        <!-- Mobile menu button -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#vipulseNavbar"
                aria-controls="vipulseNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation links -->
        <div class="collapse navbar-collapse" id="vipulseNavbar">

            <div class="navbar-nav">

                <a class="nav-link px-3 {% if request.resolver_match.url_name == 'dashboard' %}active bg-primary text-white rounded{% endif %}"
                   href="{% url 'dashboard' %}">
                    Dashboard
                </a>

                <a class="nav-link px-3 {% if request.resolver_match.url_name == 'player_list' %}active bg-primary text-white rounded{% endif %}"
                   href="{% url 'player_list' %}">
                    Players
                </a>

                <a class="nav-link px-3 {% if request.resolver_match.url_name == 'review_list' %}active bg-primary text-white rounded{% endif %}"
                   href="{% url 'review_list' %}">
                    Reviews
                </a>

            </div>

            <!-- Logout -->
            <form method="post" action="{% url 'logout' %}"
                  class="ms-lg-auto mt-3 mt-lg-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light">
                    Log Out
                </button>
            </form>

        </div>

    </div>
</nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
