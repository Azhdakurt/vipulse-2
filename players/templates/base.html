<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}VIPulse 2.0{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
            💎 VIPulse
        </a>
        <div class="navbar-nav">
    <a class="nav-link px-3 {% if request.resolver_match.url_name == 'dashboard' %}active bg-primary text-white rounded{% endif %}"
   href="{% url 'dashboard' %}">
        Dashboard
    </a>

   <a class="nav-link px-3 {% if request.resolver_match.url_name == 'player_list' %}active bg-primary text-white rounded{% endif %}"
   href="{% url 'player_list' %}">
    Players
</a>
</div>
    </div>
</nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
