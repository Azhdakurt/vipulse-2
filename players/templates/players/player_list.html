
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>VIPulse 2.0 | Players</title>
</head>
<body>
    <h1>VIPulse 2.0 - Player Management</h1>
<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Log Out</button>
</form>
    <h2>VIP Players</h2>

    <a href="{% url 'player_create' %}">
        + Add New Player
    </a>

    <hr>

    {% for player in players %}
        <div>
            <h3>{{ player.username }}</h3>
            <p>Player ID: {{ player.player_id }}</p>
            <p>VIP Tier: {{ player.get_vip_tier_display }}</p>

            <a href="{% url 'player_update' player.pk %}">
                Edit Player
            </a>
            <a href="{% url 'player_delete' player.pk %}">
    Delete Player
</a>
        </div>
        <hr>
    {% empty %}
        <p>No players have been added yet.</p>
    {% endfor %}
</body>
</html>
